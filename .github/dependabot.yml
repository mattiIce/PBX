# Dependabot configuration for the PBX project
# This file configures automated dependency updates for Python (pip) and npm packages
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Group dependency updates
    groups:
      # Production dependencies (minor and patch updates)
      production-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "*-dev"
          - "pytest*"
          - "ruff"
          - "mypy"
    # Ignore versions that are known-incompatible with the project's transitive
    # constraints (mirrors the caps documented in constraints.txt / pyproject.toml).
    # Each major only becomes mergeable once the blocking dependency relaxes its
    # bound; until then Dependabot should not keep re-opening un-mergeable PRs.
    ignore:
      # cryptography is capped <49 by fido2 2.2.0 (requires cryptography>35,<49)
      - dependency-name: "cryptography"
        versions: [">=49"]
      # av is capped <17 by aiortc 1.14.0 (requires av>=14.0.0,<17.0.0)
      - dependency-name: "av"
        versions: [">=17"]
      # thinc is capped <8.4 by spacy 3.8.14 (requires thinc>=8.3,<8.4)
      - dependency-name: "thinc"
        versions: [">=8.4"]
      # numpy is capped <2.5 by numba>=0.65 (numba ships no numpy 2.5 wheels yet);
      # numpy 2.5 forces a backtrack to numba 0.53 / llvmlite 0.36, which cannot build on 3.13+
      - dependency-name: "numpy"
        versions: [">=2.5"]
    # Limit the number of open Dependabot PRs for Python dependencies
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "⬆️"
      include: "scope"

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Group dependency updates
    groups:
      # Production dependencies (minor and patch updates)
      production-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "*-dev"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "⬆️"
      include: "scope"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "⬆️"
      include: "scope"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "⬆️"
      include: "scope"
